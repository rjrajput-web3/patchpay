[package]
name = "patchpay-escrow"
version = "0.1.0"
edition = "2021"
description = "PATCHPAY GitHub bounty escrow contract (NEAR testnet)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
