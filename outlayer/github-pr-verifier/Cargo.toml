[package]
name = "github-pr-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PATCHPAY OutLayer WASM verifier: proves a GitHub PR was merged (wasm32-wasip2, stdin JSON in / stdout JSON out)."

[[bin]]
name = "github-pr-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Outgoing HTTPS for WASI P2 (same crate used by OutLayer's own
# wasi-examples: vault-checker, oracle-example, weather-example).
# WASM-only: host tests use fixtures instead of live fetch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
